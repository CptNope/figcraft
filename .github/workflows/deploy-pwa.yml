name: Deploy FigCraft PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pwa.yml"
      - "pwa/**"
      - "apps/figcraft-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "packaging/web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: figcraft-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build FigCraft Rust WASM and package PWA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: figcraft-web-pwa
      - name: Install Trunk 0.21.14
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Build browser interface design editor
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        working-directory: apps/figcraft-web
        run: trunk build --release
      - name: Verify web package
        run: bash packaging/web/package.sh --skip-build
      - name: Prepare installable PWA
        run: python3 pwa/prepare_site.py dist/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    name: Publish FigCraft PWA
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
